name: Collect metrics

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date to collect (YYYY-MM-DD, default: yesterday)'
        required: false

jobs:
  collect:
    runs-on: ubuntu-latest
    # Shared with the fix-judge writeback job: both push to main, so they never run at once.
    concurrency:
      group: metrics-push
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Collect metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect.sh "$INPUT_DATE"
          else
            ./scripts/collect.sh
          fi

      - name: Collect rework metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-rework.sh "$INPUT_DATE"
          else
            ./scripts/collect-rework.sh
          fi

      - name: Collect failure metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-failures.sh "$INPUT_DATE"
          else
            ./scripts/collect-failures.sh
          fi

      - name: Collect community metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-community.sh "$INPUT_DATE"
          else
            ./scripts/collect-community.sh
          fi

      - name: Collect PR type metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
          PR_TYPE_REPOS: fullsend,agents
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-pr-type.sh "$INPUT_DATE"
          else
            ./scripts/collect-pr-type.sh
          fi

      - name: Collect quality signal metrics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-quality.sh "$INPUT_DATE"
          else
            ./scripts/collect-quality.sh
          fi

      - name: Collect escaped-fix metrics
        id: escaped
        # A failure here leaves its CSVs unchanged and must not stop the other metrics from being committed;
        # the next run catches up the missed days. The last step fails the run so the failure is seen.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_DATE: ${{ github.event.inputs.date }}
        run: |
          if [[ -n "$INPUT_DATE" ]]; then
            ./scripts/collect-escaped-fixes.sh "$INPUT_DATE"
          else
            ./scripts/collect-escaped-fixes.sh
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "metrics: $(date -d yesterday +%Y-%m-%d)"
          git push

      - name: Report a failed escaped-fix step
        if: steps.escaped.outcome == 'failure'
        run: |
          echo "::error::Collect escaped-fix metrics failed; the other metrics were committed, and the next run catches up the missed days"
          exit 1
